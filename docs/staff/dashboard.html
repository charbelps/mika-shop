<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <!-- staff app on the phone home screen (needed for iPhone notifications) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#2f3d22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Orders">
  <title>Dashboard</title>
  <link rel="stylesheet" href="../css/staff.css">
  <link rel="stylesheet" href="../css/packing.css">
  <link rel="stylesheet" href="../css/delivery.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script src="../js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"
          integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF"
          crossorigin="anonymous"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/staff-auth.js"></script>
</head>
<!-- Owner dashboard (Phase 3): sales, orders by status, best sellers, slow items, low stock, cash owed, governorates. -->
<body class="auth-pending theme-linen">
  <div class="app">
    <header class="topbar">
      <div class="who"><strong data-staff-name></strong><small data-staff-role></small></div>
      <button type="button" class="btn btn-ghost btn-small" data-lang-toggle data-i18n="common.lang_toggle"></button>
      <button type="button" class="btn btn-small" data-sign-out data-i18n="staff.sign_out"></button>
    </header>
    <nav class="nav">
      <a href="admin.html" data-roles="ADMIN"><span class="ico" aria-hidden="true">📦</span><span data-i18n="staff.nav_products"></span></a>
      <a href="prep.html" data-roles="ADMIN OWNER"><span class="ico" aria-hidden="true">🧾</span><span data-i18n="staff.nav_orders"></span></a>
      <a href="packing.html" data-roles="ADMIN OWNER"><span class="ico" aria-hidden="true">✅</span><span data-i18n="staff.nav_packing"></span></a>
      <a href="delivery.html" data-roles="ADMIN OWNER"><span class="ico" aria-hidden="true">🛵</span><span data-i18n="staff.nav_delivery"></span></a>
      <a href="dashboard.html" aria-current="page" data-roles="ADMIN OWNER"><span class="ico" aria-hidden="true">📊</span><span data-i18n="staff.nav_dashboard"></span></a>
      <a href="settings.html" data-roles="ADMIN OWNER"><span class="ico" aria-hidden="true">⚙️</span><span data-i18n="staff.nav_settings"></span></a>
    </nav>
    <main class="main db-main">
      <div class="toolbar pk-head">
        <h1 data-i18n="db.title"></h1>
        <button type="button" class="btn btn-small" id="db-refresh" data-i18n="db.refresh"></button>
      </div>
      <p class="hint" id="db-updated"></p>
      <section class="db-kpis" id="db-kpis" aria-label="Sales"></section>
      <div class="toolbar chips-row db-range" role="group" aria-labelledby="db-range-label">
        <span id="db-range-label" class="hint" data-i18n="db.range"></span>
        <button type="button" class="chip-btn" data-days="7" aria-pressed="false"></button>
        <button type="button" class="chip-btn" data-days="30" aria-pressed="true"></button>
        <button type="button" class="chip-btn" data-days="90" aria-pressed="false"></button>
      </div>
      <div class="db-grid" id="db-grid" aria-live="polite"></div>
    </main>
  </div>
  <script src="../js/dashboard.js"></script>
</body>
</html>
