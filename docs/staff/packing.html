<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Packing</title>
  <link rel="stylesheet" href="../css/staff.css">
  <link rel="stylesheet" href="../css/packing.css">
  <script src="../js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"
          integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF"
          crossorigin="anonymous"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/staff-auth.js"></script>
</head>
<body class="auth-pending theme-linen">
  <div class="app">
    <header class="topbar">
      <div class="who"><strong data-staff-name></strong><small data-staff-role></small></div>
      <button type="button" class="btn btn-ghost btn-small" data-lang-toggle data-i18n="common.lang_toggle"></button>
      <button type="button" class="btn btn-small" data-sign-out data-i18n="staff.sign_out"></button>
    </header>
    <nav class="nav">
      <a href="admin.html" data-roles="ADMIN"><span class="ico" aria-hidden="true">📦</span><span data-i18n="staff.nav_products"></span></a>
      <a href="prep.html" data-roles="ADMIN OWNER"><span class="ico" aria-hidden="true">🧾</span><span data-i18n="staff.nav_orders"></span></a>
      <a href="packing.html" aria-current="page" data-roles="ADMIN OWNER"><span class="ico" aria-hidden="true">✅</span><span data-i18n="staff.nav_packing"></span></a>
      <a href="settings.html" data-roles="ADMIN OWNER"><span class="ico" aria-hidden="true">⚙️</span><span data-i18n="staff.nav_settings"></span></a>
    </nav>
    <main class="main pk-main">
      <div class="toolbar pk-head">
        <h1 data-i18n="pk.title"></h1>
        <span class="pill" id="pk-live"></span>
      </div>
      <p class="hint" id="pk-intro" data-i18n="pk.intro"></p>
      <div class="pk-views" role="tablist">
        <button type="button" class="pk-view" role="tab" data-view="pick" aria-selected="true"><span data-i18n="pk.view_pick"></span> <span class="pk-count" id="pk-n-pick"></span></button>
        <button type="button" class="pk-view" role="tab" data-view="cards" aria-selected="false"><span data-i18n="pk.view_cards"></span> <span class="pk-count" id="pk-n-cards"></span></button>
      </div>
      <p class="pk-readonly hint" id="pk-readonly" hidden data-i18n="pk.read_only"></p>
      <section id="pk-pick" class="pk-pick" aria-live="polite"></section>
      <section id="pk-cards" class="pk-cards" hidden aria-live="polite"></section>
    </main>
  </div>
  <script src="../js/packing.js"></script>
</body>
</html>
