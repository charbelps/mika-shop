<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Orders</title>
  <link rel="stylesheet" href="../css/staff.css">
  <link rel="stylesheet" href="../css/print.css" media="print">
  <script src="../js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"
          integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF"
          crossorigin="anonymous"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/staff-auth.js"></script>
</head>
<body class="auth-pending">
  <div class="app">
    <header class="topbar">
      <div class="who"><strong data-staff-name></strong><small data-staff-role></small></div>
      <button type="button" class="btn btn-ghost btn-small" data-lang-toggle data-i18n="common.lang_toggle"></button>
      <button type="button" class="btn btn-small" data-sign-out data-i18n="staff.sign_out"></button>
    </header>
    <nav class="nav">
      <a href="admin.html" data-roles="ADMIN"><span class="ico" aria-hidden="true">📦</span><span data-i18n="staff.nav_products"></span></a>
      <a href="prep.html" aria-current="page" data-roles="ADMIN OWNER"><span class="ico" aria-hidden="true">🧾</span><span data-i18n="staff.nav_orders"></span></a>
    </nav>
    <main class="main">
      <div class="toolbar">
        <h1 style="flex:1;margin:0" data-i18n="staff.nav_orders"></h1>
        <span class="pill" id="o-live"></span>
        <a class="btn btn-primary btn-small" href="new-order.html" data-roles="ADMIN" data-i18n="prep.new_order_btn"></a>
      </div>
      <div class="toolbar chips-row">
        <button type="button" class="chip-btn" data-otab="todo" aria-pressed="true" data-i18n="prep.tab_todo"></button>
        <button type="button" class="chip-btn" data-otab="awaiting" aria-pressed="false" data-i18n="prep.tab_awaiting"></button>
        <button type="button" class="chip-btn" data-otab="packed" aria-pressed="false" data-i18n="prep.tab_packed"></button>
        <button type="button" class="chip-btn" data-otab="all" aria-pressed="false" data-i18n="prep.tab_all"></button>
      </div>
      <div class="toolbar">
        <input type="search" id="o-search" data-i18n-placeholder="prep.search" autocomplete="off">
      </div>
      <p class="hint" id="o-count"></p>
      <div class="list" id="o-list"></div>
      <div class="pager" id="o-pager" hidden>
        <button type="button" class="btn btn-small" id="o-prev" data-i18n="admin.prev"></button>
        <span id="o-page"></span>
        <button type="button" class="btn btn-small" id="o-next" data-i18n="admin.next"></button>
      </div>
    </main>
  </div>

  <dialog class="sheet" id="order-dialog" aria-labelledby="od-title">
    <div class="sheet-head">
      <h2 id="od-title"></h2>
      <button type="button" class="btn btn-ghost" data-close data-i18n="common.close"></button>
    </div>
    <div class="sheet-body" id="od-body"></div>
  </dialog>

  <dialog class="sheet small" id="cancel-dialog" aria-labelledby="cx-title">
    <div class="sheet-head"><h2 id="cx-title"></h2></div>
    <div class="sheet-body">
      <p data-i18n="prep.cancel_help"></p>
      <div class="alert alert-error" id="cx-error" role="alert" hidden></div>
      <label for="cx-reason" data-i18n="prep.cancel_reason"></label>
      <textarea id="cx-reason" maxlength="300"></textarea>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn" data-close data-i18n="prep.cancel_keep"></button>
      <button type="button" class="btn btn-danger" id="cx-go" data-i18n="prep.cancel_go"></button>
    </div>
  </dialog>

  <div id="slip" class="slip" aria-hidden="true"></div>
  <script src="../js/prep.js"></script>
</body>
</html>
