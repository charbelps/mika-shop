<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <!-- staff app on the phone home screen (needed for iPhone notifications) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#2f3d22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Orders">
  <title>Settings</title>
  <link rel="stylesheet" href="../css/staff.css">
  <script src="../js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"
          integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF"
          crossorigin="anonymous"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/staff-auth.js"></script>
</head>
<body class="auth-pending">
  <div class="app">
    <header class="topbar">
      <div class="who"><strong data-staff-name></strong><small data-staff-role></small></div>
      <button type="button" class="btn btn-ghost btn-small" data-lang-toggle data-i18n="common.lang_toggle"></button>
      <button type="button" class="btn btn-small" data-sign-out data-i18n="staff.sign_out"></button>
    </header>
    <nav class="nav">
      <a href="admin.html" data-roles="ADMIN"><span class="ico" aria-hidden="true">📦</span><span data-i18n="staff.nav_products"></span></a>
      <a href="prep.html" data-roles="ADMIN OWNER"><span class="ico" aria-hidden="true">🧾</span><span data-i18n="staff.nav_orders"></span></a>
      <a href="packing.html" data-roles="ADMIN OWNER"><span class="ico" aria-hidden="true">✅</span><span data-i18n="staff.nav_packing"></span></a>
      <a href="delivery.html" data-roles="ADMIN OWNER"><span class="ico" aria-hidden="true">🛵</span><span data-i18n="staff.nav_delivery"></span></a>
      <a href="settings.html" aria-current="page" data-roles="ADMIN OWNER"><span class="ico" aria-hidden="true">⚙️</span><span data-i18n="staff.nav_settings"></span></a>
    </nav>
    <main class="main">
      <div class="toolbar">
        <h1 style="flex:1;margin:0" data-i18n="staff.nav_settings"></h1>
      </div>
      <div class="toolbar chips-row">
        <button type="button" class="chip-btn" data-stab="shop" aria-pressed="true" data-i18n="set.tab_shop"></button>
        <button type="button" class="chip-btn" data-stab="texts" aria-pressed="false" data-i18n="set.tab_texts"></button>
        <button type="button" class="chip-btn" data-stab="delivery" aria-pressed="false" data-i18n="set.tab_delivery"></button>
        <button type="button" class="chip-btn" data-stab="staff" aria-pressed="false" data-roles="ADMIN" data-i18n="set.tab_staff"></button>
      </div>
      <p class="alert alert-warn" id="set-readonly" data-i18n="set.readonly" hidden></p>

      <!-- ================= SHOP SETTINGS ================= -->
      <!-- onsubmit: never let the browser submit by itself; settings.js handles the button. -->
      <form id="set-form" novalidate autocomplete="off" onsubmit="return false">
        <div id="set-groups"></div>
        <div class="alert alert-error" id="set-error" role="alert" hidden></div>
        <div class="set-save">
          <button type="submit" class="btn btn-primary btn-block" id="set-save" data-i18n="set.save"></button>
        </div>
      </form>

      <!-- ================= CUSTOMER-FACING BUSINESS TEXT ================= -->
      <form id="text-form" novalidate autocomplete="off" onsubmit="return false" hidden>
        <p class="hint" data-i18n="set.texts_intro"></p>
        <div id="text-groups"></div>
        <div class="alert alert-error" id="text-error" role="alert" hidden></div>
        <div class="set-save">
          <button type="submit" class="btn btn-primary btn-block" id="text-save" data-i18n="set.save"></button>
        </div>
      </form>

      <!-- ================= DELIVERY AREAS ================= -->
      <section id="zones" hidden>
        <p class="hint" data-i18n="set.zones_intro"></p>
        <div class="toolbar">
          <input type="search" id="z-search" data-i18n-placeholder="set.zones_search" autocomplete="off">
          <select id="z-filter" aria-label="Filter">
            <option value="" data-i18n="set.zones_all"></option>
            <option value="nofee" data-i18n="set.zones_nofee"></option>
            <option value="off" data-i18n="set.zones_off"></option>
          </select>
        </div>
        <p class="hint" id="z-count"></p>
        <div id="z-list"></div>
        <fieldset id="z-add-box">
          <legend data-i18n="set.zone_add"></legend>
          <div class="grid-2 stack-sm">
            <div class="field"><label for="za-gov" data-i18n="set.zone_gov"></label><input id="za-gov" type="text" list="za-govs" maxlength="60"><datalist id="za-govs"></datalist></div>
            <div class="field"><label for="za-gov-ar" data-i18n="set.zone_gov_ar"></label><input id="za-gov-ar" type="text" dir="rtl" lang="ar" maxlength="60"></div>
            <div class="field"><label for="za-dis" data-i18n="set.zone_dis"></label><input id="za-dis" type="text" maxlength="60"></div>
            <div class="field"><label for="za-dis-ar" data-i18n="set.zone_dis_ar"></label><input id="za-dis-ar" type="text" dir="rtl" lang="ar" maxlength="60"></div>
          </div>
          <p class="hint" data-i18n="set.zone_add_hint"></p>
          <div class="alert alert-error" id="za-error" role="alert" hidden></div>
          <button type="button" class="btn btn-primary" id="za-go" data-i18n="set.zone_add_go"></button>
        </fieldset>
      </section>

      <!-- ================= STAFF (ADMIN only; logins are managed by the Edge Function staff-admin) ================= -->
      <section id="staff" hidden>
        <p class="hint" data-i18n="st.intro"></p>
        <div class="list" id="st-list"></div>
        <fieldset id="st-add">
          <legend data-i18n="st.add"></legend>
          <div class="grid-2 stack-sm">
            <div class="field"><label for="st-name" data-i18n="st.name"></label><input id="st-name" type="text" maxlength="60" autocomplete="off"></div>
            <div class="field"><label for="st-email" data-i18n="st.email"></label><input id="st-email" type="email" dir="ltr" maxlength="200" autocomplete="off"></div>
          </div>
          <div class="field">
            <span class="label-like" data-i18n="st.role"></span>
            <div id="st-roles"></div>
          </div>
          <div class="field">
            <label for="st-password" data-i18n="st.password"></label>
            <div class="input-with-btn"><input id="st-password" type="text" dir="ltr" maxlength="72" autocomplete="off" spellcheck="false">
              <button type="button" class="btn btn-small" id="st-gen" data-i18n="st.generate"></button></div>
            <p class="hint" data-i18n="st.password_hint"></p>
          </div>
          <div class="alert alert-error" id="st-error" role="alert" hidden></div>
          <button type="button" class="btn btn-primary" id="st-create" data-i18n="st.create"></button>
        </fieldset>
      </section>
    </main>
  </div>

  <!-- shown once after creating a login or resetting a password -->
  <dialog class="sheet small" id="st-done" aria-labelledby="st-done-title">
    <div class="sheet-head"><h2 id="st-done-title"></h2></div>
    <div class="sheet-body">
      <p id="st-done-text"></p>
      <pre class="st-creds" id="st-creds" dir="ltr"></pre>
      <p class="hint" data-i18n="st.done_hint"></p>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn" id="st-copy" data-i18n="st.copy"></button>
      <button type="button" class="btn btn-primary" data-close data-i18n="common.close"></button>
    </div>
  </dialog>
  <script src="../js/settings.js"></script>
</body>
</html>
